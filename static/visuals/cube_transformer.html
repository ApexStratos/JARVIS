<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"size":39,"morph":1,"twist":0.5,"ripple":2.5};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const size = addControl("size", "Size", 20, 120, 70);
                 const morph = addControl("morph", "Morph Speed", 0.1, 3.0, 1.0);
                 const twist = addControl("twist", "Twist", 0.0, 2.0, 0.5);
                 const ripple = addControl("ripple", "Ripple", 0.0, 10.0, 2.5);
                 
                 const phase = time * morph;
                 const shape = (Math.sin(phase) * 0.5 + 0.5) * 3.999;
                 
                 const t = (i + 0.5) / count;
                 const g = 2.399963229728653;
                 
                 const y = 1.0 - 2.0 * t;
                 const r = Math.sqrt(Math.max(0.0, 1.0 - y * y));
                 const a = i * g;
                 
                 const sx = Math.cos(a) * r;
                 const sy = y;
                 const sz = Math.sin(a) * r;
                 
                 const ax = Math.abs(sx);
                 const ay = Math.abs(sy);
                 const az = Math.abs(sz);
                 const m = Math.max(ax, Math.max(ay, az)) + 0.000001;
                 
                 const cx = sx / m;
                 const cy = sy / m;
                 const cz = sz / m;
                 
                 const ox = Math.sign(sx);
                 const oy = Math.sign(sy);
                 const oz = Math.sign(sz);
                 
                 const dx = (cx + ox) * 0.5;
                 const dy = (cy + oy) * 0.5;
                 const dz = (cz + oz) * 0.5;
                 
                 const k0 = Math.max(0.0, 1.0 - Math.abs(shape - 0.0));
                 const k1 = Math.max(0.0, 1.0 - Math.abs(shape - 1.0));
                 const k2 = Math.max(0.0, 1.0 - Math.abs(shape - 2.0));
                 const k3 = Math.max(0.0, 1.0 - Math.abs(shape - 3.0));
                 const sum = k0 + k1 + k2 + k3 + 0.000001;
                 
                 const w0 = k0 / sum;
                 const w1 = k1 / sum;
                 const w2 = k2 / sum;
                 const w3 = k3 / sum;
                 
                 const diamondScale = 1.0 / (ax + ay + az + 0.000001);
                 const hx = sx * diamondScale;
                 const hy = sy * diamondScale;
                 const hz = sz * diamondScale;
                 
                 const tx = Math.tanh(sx * 2.2);
                 const ty = Math.tanh(sy * 2.2);
                 const tz = Math.tanh(sz * 2.2);
                 
                 let x = sx * w0 + cx * w1 + hx * w2 + tx * w3;
                 let yy = sy * w0 + cy * w1 + hy * w2 + ty * w3;
                 let z = sz * w0 + cz * w1 + hz * w2 + tz * w3;
                 
                 const ang = twist * phase + yy * 1.5;
                 const c = Math.cos(ang);
                 const s = Math.sin(ang);
                 
                 const rx = x * c - z * s;
                 const rz = x * s + z * c;
                 
                 const wave = 1.0 + 0.08 * ripple * Math.sin(10.0 * t + phase * 2.0);
                 
                 target.set(
                 rx * size * wave,
                 yy * size * wave,
                 rz * size * wave
                 );
                 
                 const hue = (shape * 0.25 + t * 0.2 + phase * 0.03) % 1.0;
                 const light = 0.45 + 0.2 * (1.0 - Math.abs(yy));
                 color.setHSL(hue, 0.9, light);
                 
                 if (i === 0) {
                 setInfo(
                 "Morphing Polyforms",
                 "Continuously morphs Sphere → Cube → Octahedron → Rounded Cube → Sphere with smooth interpolation."
                 );
                 annotate("center", new THREE.Vector3(0, 0, 0), "Morph Core");
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
