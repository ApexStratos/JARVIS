<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":36.9,"twist":1.2,"gravity":0,"chaos":0.6};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const scale = addControl("scale", "Nebula Size", 5, 150, 60);
                 const twist = addControl("twist", "Twist Factor", 0, 4, 1.2);
                 const gravity = addControl("gravity", "Vertical Pull", -2, 2, 0.0);
                 const chaos = addControl("chaos", "Chaos Intensity", 0, 2, 0.6);
                 const golden = 1.618033988749895;
                 const theta = i * golden * 6.283185307;
                 const phi = Math.acos(1 - 2 * (i + 0.5) / count);
                 const radius = scale * (0.8 + 0.3 * Math.sin(time * 0.5 + i * 0.001));
                 const rWarp = radius + chaos * 10 * Math.sin(theta * 3 + phi * 2 + time * 0.7);
                 const thetaWarp = theta + twist * Math.sin(phi * 4 + time * 0.4);
                 const x = rWarp * Math.sin(phi) * Math.cos(thetaWarp);
                 const y = rWarp * Math.cos(phi);
                 const z = rWarp * Math.sin(phi) * Math.sin(thetaWarp);
                 const gx = x + chaos * 2 * Math.sin(y * 0.1 + time * 0.5);
                 const gy = y + gravity * 0.15 + chaos * 1.5 * Math.sin(x * 0.08 + z * 0.06 + time * 0.3);
                 const gz = z + chaos * 2 * Math.cos(x * 0.07 + y * 0.09 + time * 0.4);
                 target.set(gx, gy, gz);
                 const hue = (0.6 + 0.4 * Math.sin(theta * 0.5 + phi * 0.3 + time * 0.05)) % 1.0;
                 const lightness = 0.4 + 0.4 * (0.5 + 0.5 * Math.sin(time * 0.2 + i * 0.0005));
                 color.setHSL(hue, 0.85, Math.min(1, Math.max(0.2, lightness)));
                 if (i === 0) {
                 setInfo("Chaotic Nebula", "Gravity‑twisted spherical particle field with organic breathing.");
                 annotate("center", new THREE.Vector3(0, 0, 0), "Core");
                 }
                 
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
