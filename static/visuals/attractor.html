<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":42.4,"spread":1,"flow":0.8,"morph":0.45};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const scale = addControl("scale", "Scale", 20, 180, 90);
                 const spread = addControl("spread", "Spread", 0.2, 2.5, 1.0);
                 const flow = addControl("flow", "Flow", 0.0, 2.0, 0.8);
                 const morph = addControl("morph", "Morph", 0.0, 1.0, 0.45);
                 
                 if (i === 0) {
                     setInfo(
                         "Emergent Attractor",
                         "A continuous dynamical field inspired by strange attractors, orbital mechanics, ocean currents and latent manifolds. Particles converge toward a stable evolving structure."
                     );
                 
                     annotate(
                         "core",
                         new THREE.Vector3(0, 0, 0),
                         "Attractor"
                     );
                 }
                 
                 const t = i / count;
                 
                 const theta = t * Math.PI * 40.0;
                 
                 const r0 = 0.35 + 0.65 * Math.sqrt(t);
                 
                 const w1 = Math.sin(theta * 0.7 + time * 0.25);
                 const w2 = Math.sin(theta * 1.9 - time * 0.17);
                 const w3 = Math.cos(theta * 3.3 + time * 0.11);
                 
                 const attract =
                     r0 *
                     (
                         1.0 +
                         0.25 * w1 +
                         0.12 * w2 * w3
                     );
                 
                 const bend =
                     0.8 * Math.sin(theta * 0.5 + time * 0.2) +
                     0.3 * Math.sin(theta * 2.7 - time * 0.13);
                 
                 const x =
                     scale *
                     attract *
                     Math.cos(theta + bend * spread);
                 
                 const y =
                     scale *
                     attract *
                     Math.sin(theta + bend * spread);
                 
                 const z =
                     scale *
                     (
                         0.55 * Math.sin(theta * 0.55) +
                         0.28 * Math.sin(theta * 1.73 + time * 0.22) +
                         0.15 * Math.cos(theta * 4.1)
                     );
                 
                 const swirl =
                     flow *
                     Math.sin(
                         Math.sqrt(
                             x * x +
                             y * y
                         ) * 0.06 -
                         time * 0.8
                     );
                 
                 const px =
                     x +
                     swirl * y * 0.12;
                 
                 const py =
                     y -
                     swirl * x * 0.12;
                 
                 const pz =
                     z +
                     scale *
                     morph *
                     0.18 *
                     Math.sin(
                         theta * 0.9 +
                         time * 0.35
                     );
                 
                 target.set(px, py, pz);
                 
                 const hue =
                     0.58 +
                     0.10 *
                     Math.sin(theta * 0.08 + time * 0.03);
                 
                 const sat =
                     0.55 +
                     0.35 *
                     (0.5 + 0.5 * Math.sin(theta * 0.31));
                 
                 const light =
                     0.35 +
                     0.28 *
                     Math.exp(-Math.abs(attract - 0.75));
                 
                 color.setHSL(hue, sat, light);
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
