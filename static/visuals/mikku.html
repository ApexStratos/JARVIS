<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"pull":1,"spin":2.615,"discSize":50};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const pull = addControl("pull", "Event Horizon Grip", 1.0, 10.0, 5.0);
                 const spin = addControl("spin", "Accretion Velocity", 0.5, 5.0, 2.5);
                 const discSize = addControl("discSize", "Accretion Radius", 10.0, 50.0, 30.0);
                 const idx = i;
                 const total = count;
                 const idRate = idx / total;
                 const pType = idx % 4;
                 let rad = 0.0;
                 let angle = 0.0;
                 let px = 0.0;
                 let py = 0.0;
                 let pz = 0.0;
                 let h = 0.0;
                 let s = 1.0;
                 let l = 0.5;
                 const tSpin = time * spin;
                 if (pType === 0) {
                 const rIdx = idx / (total * 0.25);
                 rad = 1.5 + rIdx * 2.0;
                 angle = rIdx * 100.0 - tSpin * (10.0 / (rad + 0.1));
                 px = Math.cos(angle) * rad;
                 py = (Math.random() - 0.5) * 0.2;
                 pz = Math.sin(angle) * rad;
                 h = 0.02 + rIdx * 0.05;
                 s = 1.0;
                 l = 0.1 / (rad + 0.1);
                 } else if (pType === 1) {
                 const rIdx = (idx - total * 0.25) / (total * 0.5);
                 const ringRad = 4.0 + rIdx * discSize;
                 angle = rIdx * 40.0 - tSpin * (15.0 / (ringRad + 0.1));
                 px = Math.cos(angle) * ringRad;
                 py = Math.sin(angle * 2.0) * (2.0 / (ringRad + 0.1)) * Math.sin(time);
                 pz = Math.sin(angle) * ringRad;
                 h = 0.04 + (1.0 - rIdx) * 0.12;
                 s = 1.0;
                 l = 0.7 * (1.0 - rIdx);
                 } else {
                 const rIdx = (idx - total * 0.75) / (total * 0.25);
                 const jetZ = 3.0 + rIdx * 40.0;
                 const jetRad = 0.2 + rIdx * 4.0;
                 angle = rIdx * 20.0 + time * 8.0;
                 const side = (pType === 2) ? 1.0 : -1.0;
                 px = Math.cos(angle) * jetRad;
                 py = jetZ * side;
                 pz = Math.sin(angle) * jetRad;
                 h = 0.55 + rIdx * 0.1;
                 s = 0.9;
                 l = 0.8 * (1.0 - rIdx);
                 }
                 const dist = Math.sqrt(px * px + py * py + pz * pz) + 0.001;
                 const warp = 1.0 - Math.min(1.0, pull / dist);
                 target.set(px * warp, py * warp, pz * warp);
                 color.setHSL(h % 1.0, s, Math.max(0.0, Math.min(1.0, l)));
                 if (i === 0) {
                 setInfo("Deep Space Singularity", "An accretion disc and relativistic jets distorted by gravitational warping.");
                 annotate("horizon", new THREE.Vector3(0, 0, 0), "Event Horizon");
                 }
                 
                 
                 
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
