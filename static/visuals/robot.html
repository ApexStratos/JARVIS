<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":8.11,"pulse":1.666,"glow":1.5};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const scale = addControl("scale", "Scale", 2.0, 15.0, 6.0);
                 const pulse = addControl("pulse", "Energy Pulse", 0.1, 3.0, 1.0);
                 const glowInt = addControl("glow", "Glow Intensity", 0.0, 2.0, 1.5);
                 
                 const p = i / count;
                 const t = time * pulse;
                 
                 // Structural coordinates mapping
                 const theta = p * Math.PI * 2.0 * 150.0; // High-frequency winding
                 const heightNorm = p * 2.0 - 1.0;        // -1 to 1
                 const h = heightNorm * 6.0;              // -6 to 6
                 
                 // Density mapping for humanoid form (Gaussian distributions)
                 const head = Math.exp(-(h - 4.5) * (h - 4.5) * 1.5);
                 const neck = Math.exp(-(h - 3.2) * (h - 3.2) * 3.0);
                 const torso = Math.exp(-(h - 0.5) * (h - 0.5) * 0.2);
                 const waist = Math.exp(-(h + 2.0) * (h + 2.0) * 1.0);
                 const legs = Math.exp(-(h + 4.0) * (h + 4.0) * 0.3);
                 
                 // Outline radius contour
                 const r = head * 1.4 + neck * 0.6 + torso * 1.8 + waist * 1.2 + legs * 1.0;
                 
                 // Bipedal leg split
                 const legSide = Math.sign(Math.sin(p * 3141.5));
                 const legOffset = legs * legSide * 1.2;
                 
                 // Arm generation & mapping
                 const isArm = Math.exp(-(h - 1.0) * (h - 1.0) * 0.3) * (Math.sin(p * 777.0) > 0.6 ? 1.0 : 0.0);
                 const armSide = Math.sign(Math.cos(p * 3141.5));
                 const armOffset = isArm * armSide * 3.0;
                 
                 // Base positions
                 let x = Math.cos(theta) * r + legOffset + armOffset;
                 let y = h;
                 let z = Math.sin(theta) * r;
                 
                 // Breathing/Pulse motion animation
                 const breath = Math.sin(t + h * 0.5) * 0.03 + 1.0;
                 x *= breath * scale;
                 y *= breath * scale;
                 z *= breath * scale;
                 
                 // Armor styling (White Plating vs Dark Inner Frame)
                 const platePattern = Math.sin(h * 8.0) * Math.cos(theta * 4.0);
                 const isArmor = platePattern > 0.0 ? 1.0 : 0.0;
                 
                 // Color mixing (Math over logic for zero garbage collection)
                 // White armor: H=0, S=0, L=0.9 | Dark suit: H=0.6, S=0.2, L=0.1
                 let hue = (1.0 - isArmor) * 0.6;
                 let sat = (1.0 - isArmor) * 0.2;
                 let lit = isArmor * 0.9 + (1.0 - isArmor) * 0.1;
                 
                 // Glowing Elements (Visor & Chest Emblem mapping)
                 const faceVisor = head * Math.max(0.0, Math.cos(theta) - 0.7);
                 const chestEmblem = torso * Math.exp(-(h - 1.8) * (h - 1.8) * 8.0) * Math.max(0.0, Math.cos(theta) - 0.85);
                 const glowFeature = Math.max(faceVisor, chestEmblem);
                 const isGlow = glowFeature > 0.2 ? 1.0 : 0.0;
                 
                 // Override colors for glowing areas
                 const glowPulsate = Math.sin(t * 4.0) * 0.2 + 0.8;
                 hue = isGlow * 0.08 + (1.0 - isGlow) * hue; // Golden orange tone
                 sat = isGlow * 1.0 + (1.0 - isGlow) * sat;
                 lit = isGlow * (0.6 * glowPulsate * glowInt) + (1.0 - isGlow) * lit;
                 
                 // Push glowing particles slightly forward on the Z axis
                 z += isGlow * 0.5 * scale;
                 
                 // Output mutation 
                 target.set(x, y, z);
                 color.setHSL(hue, sat, Math.min(1.0, lit));
                 
                 // HUD and Annotations
                 if (i === 0) {
                     setInfo("Astra-Bot", "Mathematical Particle Swarm Simulation");
                     annotate("visor", new THREE.Vector3(0, 4.5 * scale, 1.5 * scale), "Neural Core");
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
