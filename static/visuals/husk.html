<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"speed":0.85,"fire":0.7,"size":62,"depth":18};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const speed = addControl("speed", "Signal Speed", 0.05, 3.0, 0.85);
                 const fire = addControl("fire", "Neural Firing", 0.0, 1.0, 0.7);
                 const size = addControl("size", "Brain Size", 20, 100, 62);
                 const depth = addControl("depth", "Depth", 2, 45, 18);
                 
                 const n = count > 1 ? i / (count - 1) : 0;
                 const t = time * speed;
                 const side = i % 2 === 0 ? -1.0 : 1.0;
                 const u = (n * 2.0 - 1.0);
                 const a = i * 2.399963229728653;
                 
                 const y = u * size * 0.72;
                 const top = Math.exp(-Math.pow((u - 0.28) * 1.35, 2.0));
                 const mid = Math.exp(-Math.pow((u + 0.05) * 1.65, 2.0));
                 const low = Math.exp(-Math.pow((u + 0.62) * 2.7, 2.0)) * 0.55;
                 
                 const profile = Math.max(top * 0.95, Math.max(mid, low));
                 const hemiWidth = size * profile * 0.48;
                 
                 const fold1 = Math.sin(a * 3.0 + u * 12.0 + t);
                 const fold2 = Math.sin(a * 7.0 - u * 9.0 - t * 0.7);
                 const fold3 = Math.cos(a * 11.0 + t * 1.3);
                 
                 const wrinkle = 1.0 + 0.12 * fold1 + 0.08 * fold2 + 0.04 * fold3;
                 
                 const x = side * (size * 0.18) + Math.cos(a) * hemiWidth * wrinkle;
                 const z = Math.sin(a) * depth * profile * wrinkle;
                 
                 const firingWave = Math.sin(t * 7.0 + n * 80.0 + fold1 * 3.0);
                 const firingGate = Math.sin(t * 5.0 - x * 0.18 + y * 0.08);
                 const pulse = Math.pow(Math.max(0.0, firingWave * firingGate), 10.0) * fire;
                 
                 const nx = Math.sin(t * 3.0 + n * 50.0) * pulse * 8.0;
                 const ny = Math.cos(t * 2.4 + n * 42.0) * pulse * 5.0;
                 const nz = Math.sin(t * 4.2 + n * 36.0) * pulse * 8.0;
                 
                 target.set(x + nx, y + ny, z + nz);
                 
                 const baseHue = 0.58 + 0.06 * Math.sin(u * 5.0);
                 const fireHue = 0.02 + 0.45 * Math.abs(Math.sin(n * 30.0 + t * 4.0));
                 const hue = baseHue * (1.0 - pulse) + fireHue * pulse;
                 const sat = 0.45 + pulse * 0.55;
                 const light = 0.16 + profile * 0.1 + pulse * 0.7;
                 
                 color.setHSL(hue, sat, light);
                 
                 if (i === 0) {
                   setInfo("VEXIS Neural Brain", "Two glowing hemispheres with neural signal bursts moving through a brain-like particle field.");
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
