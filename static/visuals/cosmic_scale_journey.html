<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);
        // ── JARVIS speaking reactivity ──────────────────────────────────────────
        window._jarvisSpeaking = false;
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'speaking')
                window._jarvisSpeaking = e.data.active;
        });


        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":1.415,"speed":0.898,"detail":1.1};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const _spk = window._jarvisSpeaking;
            const time = clock.getElapsedTime() * SPEED_MULT * (_spk ? 2.2 : 1.0);
            bloomPass.strength     = _spk ? 3.5 : 1.8;
            bloomPass.radius       = _spk ? 0.65 : 0.4;
            controls.autoRotateSpeed = _spk ? 5.5 : 2.0;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const simScale = addControl("scale", "Cosmic Scale", 0.5, 2.0, 1.0);
                 const simSpeed = addControl("speed", "Journey Speed", 0.1, 1.5, 0.45);
                 const detail = addControl("detail", "Structure Detail", 0.2, 2.0, 1.0);
                 
                 const pi = 3.14159265359;
                 const tau = 6.28318530718;
                 const safeCount = Math.max(1, count - 1);
                 const u = i / safeCount;
                 const cycle = (time * simSpeed) % 24.0;
                 
                 const ds0 = Math.abs(cycle - 4.0);
                 const dg0 = Math.abs(cycle - 12.0);
                 const dw0 = Math.abs(cycle - 20.0);
                 const ds = Math.min(ds0, 24.0 - ds0);
                 const dg = Math.min(dg0, 24.0 - dg0);
                 const dw = Math.min(dw0, 24.0 - dw0);
                 
                 const cs = Math.max(0.0, Math.cos(ds * pi / 12.0));
                 const cg = Math.max(0.0, Math.cos(dg * pi / 12.0));
                 const cw = Math.max(0.0, Math.cos(dw * pi / 12.0));
                 const rs = cs * cs * cs * cs;
                 const rg = cg * cg * cg * cg;
                 const rw = cw * cw * cw * cw;
                 const sum = Math.max(0.0001, rs + rg + rw);
                 const ws = rs / sum;
                 const wg = rg / sum;
                 const ww = rw / sum;
                 
                 const h1 = Math.sin((i + 1) * 12.9898) * 43758.5453;
                 const h2 = Math.sin((i + 1) * 78.233) * 23421.631;
                 const r1 = h1 - Math.floor(h1);
                 const r2 = h2 - Math.floor(h2);
                 
                 const sphereZ = 1.0 - 2.0 * u;
                 const sphereR = Math.sqrt(Math.max(0.0, 1.0 - sphereZ * sphereZ));
                 const sphereA = i * 2.39996322973 + time * 0.08;
                 const pulse = 1.0 + 0.07 * Math.sin(sphereA * 7.0 + time * 2.0);
                 const starRadius = 28.0 * pulse;
                 const sx = Math.cos(sphereA) * sphereR * starRadius;
                 const sy = sphereZ * starRadius;
                 const sz = Math.sin(sphereA) * sphereR * starRadius;
                 
                 const arm = i % 5;
                 const galaxyRadius = 7.0 + 93.0 * Math.sqrt(u);
                 const galaxyNoise = (r1 - 0.5) * (4.0 + galaxyRadius * 0.035);
                 const galaxyAngle =
                   arm * tau / 5.0 +
                   galaxyRadius * 0.078 * detail +
                   time * 0.075;
                 
                 const gx = Math.cos(galaxyAngle) * (galaxyRadius + galaxyNoise);
                 const gy =
                   (r2 - 0.5) *
                   13.0 *
                   Math.exp(-galaxyRadius / 62.0);
                 const gz = Math.sin(galaxyAngle) * (galaxyRadius + galaxyNoise);
                 
                 const gridWidth = Math.max(2.0, Math.floor(Math.sqrt(count)));
                 const gridRows = Math.max(2.0, Math.ceil(count / gridWidth));
                 const gridX = i % gridWidth;
                 const gridZ = Math.floor(i / gridWidth);
                 const px = (gridX / (gridWidth - 1.0) - 0.5) * 190.0;
                 const pz = (gridZ / (gridRows - 1.0) - 0.5) * 190.0;
                 const radiusSquared = px * px + pz * pz;
                 
                 const well = -68.0 / (1.0 + radiusSquared * 0.0032);
                 const ripple =
                   Math.sin(Math.sqrt(radiusSquared) * 0.22 - time * 1.8) *
                   4.5 *
                   Math.exp(-radiusSquared / 7200.0);
                 
                 const wx = px;
                 const wy = well + ripple;
                 const wz = pz;
                 
                 const x = (sx * ws + gx * wg + wx * ww) * simScale;
                 const y = (sy * ws + gy * wg + wy * ww) * simScale;
                 const z = (sz * ws + gz * wg + wz * ww) * simScale;
                 
                 target.set(x, y, z);
                 
                 const starHue = 0.10 + r1 * 0.04;
                 const galaxyHue = 0.68 + r2 * 0.20;
                 const wellHue = 0.52 + r1 * 0.12;
                 const hue =
                   (starHue * ws + galaxyHue * wg + wellHue * ww) % 1.0;
                 
                 const lightness =
                   0.48 +
                   0.30 * ws +
                   0.12 * Math.exp(-galaxyRadius / 35.0);
                 
                 color.setHSL(hue, 0.88, Math.min(0.86, lightness));
                 
                 if (i === 0) {
                   setInfo(
                     "Cosmic Scale Journey",
                     "A star morphs into a spiral galaxy and then into a warped spacetime field."
                   );
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
